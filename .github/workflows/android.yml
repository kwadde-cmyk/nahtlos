name: Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :automotive:assembleDebug
      - name: Rename
        run: |
          mkdir -p out
          cp mobile/build/outputs/apk/debug/mobile-debug.apk out/nahtlos-mobile-debug.apk
          cp automotive/build/outputs/apk/debug/automotive-debug.apk out/nahtlos-automotive-debug.apk
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk --title "Nahtlos (aktueller Stand)" --notes "Debug-Build von ${GITHUB_SHA::7}" --prerelease
