services:
  nahtlos:
    image: nahtlos:local
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Host-Port für Nginx Proxy Manager. Im Container bleibt der Dienst auf 8787.
      - "${NAHTLOS_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      SYNC_DB: /data/sync.db
      SYNC_TOKEN: ${SYNC_TOKEN:-dev-token-change-me}
    volumes:
      - nahtlos-data:/data
    restart: unless-stopped

volumes:
  nahtlos-data:
